name: macOS app

on:
  push:
    paths: ["macos/**", "engine/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: write

# a newer push supersedes an older run, so two runs never race to replace the release
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -e "engine[dev,faces]"
      - working-directory: engine
        run: python -m pytest -q

  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]  # macos-15 runners never picked up jobs for this repo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install ffmpeg
          ffmpeg -version | head -1
          swift --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: pip install --prefer-binary --only-binary av,ctranslate2,onnxruntime,tokenizers,opencv-python-headless -e "engine[all]"

      - name: Swift tests (ClipForgeCore)
        working-directory: macos
        run: swift test

      - name: Build ClipForge.app
        working-directory: macos
        run: ./scripts/build-app.sh

      - name: First-run engine install (as a user gets it)
        working-directory: macos
        run: |
          ./build/ClipForge.app/Contents/MacOS/ClipForge --install-engine 2>&1 | tee build/install.log | tail -25
          grep -q "INSTALL OK" build/install.log
          codesign --verify --deep --strict build/ClipForge.app && echo "PASS  app signature still valid"

      - name: App self-test (real engine, full edit, screenshots)
        working-directory: macos
        run: |
          python ../engine/tests/fixtures/make_fixture.py "$RUNNER_TEMP/fx"
          say -o "$RUNNER_TEMP/speech.aiff" "Pricing is a story, not a number. We tested three pricing pages, and the third one won by forty percent."
          ffmpeg -v error -y -f lavfi -i color=c=0x334455:s=1280x720:r=30 -i "$RUNNER_TEMP/speech.aiff" -shortest \
            -c:v libx264 -pix_fmt yuv420p -c:a aac "$RUNNER_TEMP/speech.mp4"
          CLIPFORGE_SELFTEST_SPEECH="$RUNNER_TEMP/speech.mp4" \
          CLIPFORGE_BIN="$(which clipforge)" \
          CLIPFORGE_SELFTEST_VIDEO="$RUNNER_TEMP/fx/talk.mp4" \
          CLIPFORGE_SELFTEST_WORDS="$RUNNER_TEMP/fx/talk.words.json" \
            ./build/ClipForge.app/Contents/MacOS/ClipForge --selftest --screenshots build/screenshots 2>&1 | tee build/selftest.log
          grep -q "SELFTEST OK" build/selftest.log
          grep -q "SCREENSHOTS DONE" build/selftest.log   # every screen must render with real data

      - name: Screenshots in the log (for review without downloading artifacts)
        if: always()
        working-directory: macos/build
        run: |
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            sips -Z 720 -s format jpeg -s formatOptions 40 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=====BEGIN $(basename "${f%.png}")====="
            base64 -i "${f%.png}.jpg" | fold -w 400
            echo "=====END $(basename "${f%.png}")====="
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClipForge-${{ matrix.os }}
          path: |
            macos/build/ClipForge.zip
            macos/build/screenshots

      - name: Publish download (release "mac-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest macos/build/ClipForge.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "ClipForge for Mac (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${{ matrix.os }}. Unzip, move ClipForge.app to Applications, then run once in Terminal: xattr -dr com.apple.quarantine /Applications/ClipForge.app (the app is not notarised; alternatively System Settings → Privacy & Security → Open Anyway). Needs macOS 14+, plus ffmpeg and Python 3.10+ (brew install ffmpeg python). See macos/README.md."

      - name: Self-test results (last, so they are at the end of the log)
        if: always()
        run: cat macos/build/selftest.log 2>/dev/null || echo "no self-test log"
