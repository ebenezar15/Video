[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.2.0"
description = "Claude-driven short-form video editing engine: auto-cut, text editing, looks, captions, pop-ups, motion graphics, music, B-roll, post kits."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pillow>=10",
  "numpy>=1.26",
  "pydantic>=2.5",
  "anthropic>=0.75",
  "mcp>=2.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
faces = ["opencv-python-headless>=4.8,<5"]
all = ["faster-whisper>=1.0", "opencv-python-headless>=4.8,<5"]
dev = ["pytest>=8"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
